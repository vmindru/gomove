name: gomove

# Separate containers are required for the web service's keep-id mapping.
x-podman:
  in_pod: false

services:
  web:
    build:
      context: ./container/web
      dockerfile: Containerfile
    image: localhost/gomove-web:dev
    restart: unless-stopped
    working_dir: /var/www/html
    # Map the host user to Apache's www-data account without changing host ownership.
    userns_mode: "keep-id:uid=33,gid=33"
    user: "0:0"
    env_file:
      - .env.compose
    environment:
      DB_CONNECTION: pgsql
      DB_HOST: database
      DB_PORT: "5432"
      DB_URL: ""
      COMPOSER_HOME: /tmp/composer
      npm_config_cache: /tmp/npm-cache
    volumes:
      - /home/vmindru/proj/gomove:/var/www/html:rw,z
    ports:
      - "${WEB_BIND_ADDRESS:-127.0.0.1}:${WEB_PORT:-8080}:80"
    depends_on:
      database:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://127.0.0.1/up"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 180s

  database:
    image: docker.io/library/postgres:17-bookworm
    restart: unless-stopped
    environment:
      POSTGRES_DB: "${DB_DATABASE:-gomove}"
      POSTGRES_USER: "${DB_USERNAME:-gomove}"
      POSTGRES_PASSWORD: "${DB_PASSWORD:?Run python3 scripts/init-compose-env.py first}"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 20s

volumes:
  postgres-data:
